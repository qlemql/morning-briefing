name: Daily Lesson (manual)

# 인터랙티브 학습(오늘의 만져보기)을 생성/백필. 실제 생성은 Vercel 앱(/api/lesson)이 수행.
# 과거 아카이브 브리핑을 베이스로 지나간 날짜에도 레슨을 만들 수 있다(테스트용).
# 필요한 GitHub Secrets: SITE_URL, CRON_SECRET

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'backfill(최근 N일) | generate(단일 날짜)'
        default: 'backfill'
        required: false
      days:
        description: 'backfill 시 최근 며칠 (최대 14)'
        default: '7'
        required: false
      date:
        description: 'generate 시 날짜 YYYY-MM-DD (비우면 오늘)'
        default: ''
        required: false
      force:
        description: '캐시 있어도 재생성 (1=강제, 스키마 변경 후 재생성용)'
        default: '0'
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Sanity check secrets
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL / CRON_SECRET 시크릿이 비어 있습니다."
            exit 1
          fi

      - name: Call lesson endpoint
        run: |
          mode='${{ github.event.inputs.mode }}'; mode="${mode:-backfill}"
          if [ "$mode" = "generate" ]; then
            date='${{ github.event.inputs.date }}'
            qs="generate=1"; [ -n "$date" ] && qs="$qs&date=$date"
          else
            days='${{ github.event.inputs.days }}'; days="${days:-7}"
            qs="backfill=$days"
          fi
          if [ "${{ github.event.inputs.force }}" = "1" ]; then qs="$qs&force=1"; fi
          echo "GET $SITE_URL/api/lesson?$qs"
          code=$(curl -s -o /tmp/lesson.json -w '%{http_code}' --max-time 290 \
            "$SITE_URL/api/lesson?$qs" \
            -H "Authorization: Bearer $CRON_SECRET" || echo 000)
          echo "HTTP $code"
          echo "----- response -----"; cat /tmp/lesson.json || true; echo
          [ "$code" = "200" ] || { echo "::error::lesson 실패 (HTTP $code)"; exit 1; }
