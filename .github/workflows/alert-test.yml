name: Alert Test (manual)

# 운영자 텔레그램 알림 3종을 실제로 발송해보는 수동 드릴.
# 실제 Telegram 발송은 Vercel 앱(/api/alert-test)이 Vercel env로 수행한다
# (이 워크플로는 CRON_SECRET로 그 엔드포인트를 호출만 함).
#
# 필요한 GitHub Secrets: SITE_URL, CRON_SECRET (daily-briefing.yml과 동일)

on:
  workflow_dispatch:
    inputs:
      which:
        description: '보낼 알림 (all | credit | fail | recovery)'
        default: 'all'
        required: false

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Sanity check secrets
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL / CRON_SECRET 시크릿이 비어 있습니다."
            exit 1
          fi

      - name: Send test alerts
        run: |
          which='${{ github.event.inputs.which }}'
          which="${which:-all}"
          echo "GET $SITE_URL/api/alert-test?which=$which"
          code=$(curl -s -o /tmp/at.json -w '%{http_code}' --max-time 60 \
            "$SITE_URL/api/alert-test?which=$which" \
            -H "Authorization: Bearer $CRON_SECRET" || echo 000)
          echo "HTTP $code"
          echo "----- response -----"; cat /tmp/at.json || true; echo
          if [ "$code" != "200" ]; then
            echo "::error::alert-test 실패 (HTTP $code) — /api/health에서 telegram 설정 확인"
            exit 1
          fi
          echo "✅ 테스트 알림 발송 요청 완료 — 텔레그램 확인하세요."
