name: Credit Ledger (manual)

# 크레딧 원장 조회/충전기록/시드. 실제 처리는 Vercel 앱(/api/credit)이 수행.
# Anthropic이 잔액을 API로 안 줘서 "충전 누계 − 지출 누계"를 앱이 추정 추적한다.
# 충전(Console에서 결제)한 뒤 여기서 topup으로 원장에 반영해야 저잔액 알림이 재무장된다.
#
# 필요한 GitHub Secrets: SITE_URL, CRON_SECRET (daily-briefing.yml과 동일)

on:
  workflow_dispatch:
    inputs:
      action:
        description: '동작 (status | topup | set)'
        default: 'status'
        required: false
      usd:
        description: '금액 USD (topup=더하기 / set=정확값. status면 무시)'
        default: '0'
        required: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      SITE_URL: ${{ secrets.SITE_URL }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
    steps:
      - name: Sanity check secrets
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::SITE_URL / CRON_SECRET 시크릿이 비어 있습니다."
            exit 1
          fi

      - name: Call credit ledger
        run: |
          action='${{ github.event.inputs.action }}'; action="${action:-status}"
          usd='${{ github.event.inputs.usd }}'; usd="${usd:-0}"
          echo "GET $SITE_URL/api/credit?action=$action&usd=$usd"
          code=$(curl -s -o /tmp/c.json -w '%{http_code}' --max-time 30 \
            "$SITE_URL/api/credit?action=$action&usd=$usd" \
            -H "Authorization: Bearer $CRON_SECRET" || echo 000)
          echo "HTTP $code"
          echo "----- response -----"; cat /tmp/c.json || true; echo
          if [ "$code" != "200" ]; then
            echo "::error::credit ledger 실패 (HTTP $code)"
            exit 1
          fi
